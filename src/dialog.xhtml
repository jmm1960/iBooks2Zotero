<?xml version="1.0"?>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
 <meta charset="utf-8"/><title>iBooks2Zotero</title>
 <link rel="stylesheet" href="dialog.css?v=0.4.0"/>
 <script src="i18n.js"></script><script src="core.js"></script><script src="select-control.js"></script><script defer="defer" src="dialog.js"></script>
</head>
<body>
<section class="setup" aria-label="Import settings" data-i18n-aria-label="setup">
 <div class="file-row">
  <label for="target" data-i18n="target">Target PDF</label><span id="target-static" class="target-static" hidden="hidden"></span>
  <select id="target" aria-label="Target PDF" data-i18n-aria-label="target"></select><span id="existing" class="count"></span>
 </div>
 <div class="file-row">
  <span class="field-label" data-i18n="source">Source PDF</span><span id="source" class="source-name" data-i18n="noFile" title="Choose a PDF exported from Apple Books" data-i18n-title="pickSource">No file selected</span>
  <button id="parse" data-i18n="chooseSource">Choose source PDF</button>
 </div>
 <div class="settings-row">
  <div class="range-fields"><label for="start" data-i18n="pages">Pages</label><input id="start" aria-label="Start page" data-i18n-aria-label="startPage" title="Start page in PDF page order" data-i18n-title="startHelp" type="number" min="1" step="1" value="1"/><span class="separator-word" data-i18n="to">to</span><input id="end" aria-label="End page" data-i18n-aria-label="endPage" title="End page, inclusive" data-i18n-title="endHelp" type="number" min="1" step="1" value="1"/><span id="total" class="count">/ —</span></div>
  <span class="divider"></span>
  <div class="order-field"><label for="order" data-i18n="split">Split</label><select id="order" aria-label="Split order" data-i18n-aria-label="order"><option value="vertical-horizontal" data-i18n="orderVH">Vertical, then horizontal</option><option value="horizontal-vertical" data-i18n="orderHV">Horizontal, then vertical</option><option value="vertical" data-i18n="orderV">Vertical only</option><option value="horizontal" data-i18n="orderH">Horizontal only</option></select></div>
  <div class="gap-fields" title="Split where blank space exceeds the gap. Larger gaps merge more strokes. Units: PDF points." data-i18n-title="gapsHelp"><label for="vertical" data-i18n="vGap">V gap</label><input id="vertical" aria-label="Vertical gap" data-i18n-aria-label="verticalGap" type="number" min="0" max="100" step="0.1" value="3.7"/><label for="horizontal" data-i18n="hGap">H gap</label><input id="horizontal" aria-label="Horizontal gap" data-i18n-aria-label="horizontalGap" type="number" min="0" max="100" step="0.1" value="8"/><span class="unit">pt</span></div>
  <button id="defaults" class="icon-button" title="Restore default split settings" aria-label="Restore default split settings" data-i18n-title="defaults" data-i18n-aria-label="defaults"><img src="chrome://zotero/skin/16/universal/reset.svg" alt=""/></button>
 </div>
</section>
<main class="preview">
 <div class="preview-toolbar"><span id="summary" data-i18n="summaryEmpty">Parse a source PDF to preview groups</span><div class="preview-tools"><select id="page" aria-label="Preview page" data-i18n-aria-label="previewPage" disabled="disabled"></select><select id="zoom" aria-label="Preview zoom" data-i18n-aria-label="previewZoom"><option value="fit" data-i18n="fitPage">Fit page</option><option value="actual">100%</option><option value="width" data-i18n="fitWidth">Fit width</option></select><label class="toggle"><input id="boxes" type="checkbox" checked="checked"/><span data-i18n="boxes">Group outlines</span></label><button id="export" class="icon-button" title="Export a standalone bundle of all source annotations" aria-label="Export annotation bundle" data-i18n-title="exportHelp" data-i18n-aria-label="export" disabled="disabled"><img src="chrome://zotero/skin/16/universal/export.svg" alt=""/></button></div></div>
 <div id="canvas-wrap" data-zoom="fit"><p id="empty" data-i18n="chooseHint">Choose an annotated source PDF to parse it automatically.</p><canvas id="canvas" width="700" height="930" hidden="hidden"></canvas></div>
</main>
<footer>
 <button id="clear" class="danger" title="Delete native Zotero annotations only within the selected PDF page range" data-i18n="clear" data-i18n-title="clearHelp">Clear selected pages</button>
 <div id="status" role="status" aria-live="polite" data-i18n="reading">Reading PDF…</div>
 <div class="footer-actions"><button id="replace" class="danger" disabled="disabled" title="Delete existing annotations in the selected pages, then import the source annotations" data-i18n="replace" data-i18n-title="replaceHelp">Replace selected pages</button><button id="import" class="primary" disabled="disabled" title="Keep existing annotations and append the source annotations" data-i18n="append" data-i18n-title="appendHelp">Append annotations</button><span class="divider"></span><button id="close" data-i18n="close">Close</button></div>
</footer>
</body></html>
